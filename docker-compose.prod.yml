# ==========================================
# Gamezygo Production Docker Compose Orchestration (Hostinger VPS)
# ==========================================

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: gamezygo-prod-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - gamezygo-network
    depends_on:
      - backend

  # Laravel API Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gamezygo-prod-backend
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - ./backend/.env
    volumes:
      - laravel-storage:/var/www/html/storage
    networks:
      - gamezygo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Queue Worker (Redis broker for asynchronous emails & payment processing)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gamezygo-prod-queue
    restart: always
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - ./backend/.env
    volumes:
      - laravel-storage:/var/www/html/storage
    networks:
      - gamezygo-network
    depends_on:
      - backend
      - redis

  # Nginx Unified Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gamezygo-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - laravel-storage:/var/www/html/storage:ro
    networks:
      - gamezygo-network
    depends_on:
      - frontend
      - backend

  # PostgreSQL Database (Internal only, not exposed to public internet)
  postgres:
    image: postgres:16-alpine
    container_name: gamezygo-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gamezygo}
      POSTGRES_USER: ${DB_USERNAME:-dev_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPGDBPassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - gamezygo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dev_admin} -d ${DB_DATABASE:-gamezygo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: gamezygo-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata-prod:/data
    networks:
      - gamezygo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gamezygo-network:
    driver: bridge

volumes:
  pgdata-prod:
    driver: local
  redisdata-prod:
    driver: local
  laravel-storage:
    driver: local
